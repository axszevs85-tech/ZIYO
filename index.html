<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - AI Assistant</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.3);
            --bg-color: #05070b;
            --card-bg: rgba(13, 17, 23, 0.85);
            --border-color: rgba(0, 243, 255, 0.2);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #0d1b2a 0%, #05070b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--neon-blue);
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px var(--neon-glow);
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.5);
            color: var(--neon-blue);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #startBtn {
            background: linear-gradient(135deg, #0077b6, #0096c7);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 150, 199, 0.4);
        }

        #startBtn:active {
            transform: scale(0.97);
        }

        #stopBtn {
            background: linear-gradient(135deg, #d90429, #ef233c);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 35, 60, 0.4);
        }

        #stopBtn:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #8d99ae;
            font-style: italic;
        }

        #response {
            margin-top: 20px;
            text-align: left;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 90px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #edf2f4;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #response strong {
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>J.A.R.V.I.S</h1>
        <input type="password" id="apiKey" placeholder="Mistral API Kalitini kiriting">
        
        <div class="btn-group">
            <button id="startBtn">🎤 Gapirish</button>
            <button id="stopBtn">⏹ To'xtatish</button>
        </div>

        <div id="status">Tizim tayyor. Buyruq bering...</div>
        <div id="response"><strong>Jarvis:</strong> Salom! Men sizning shaxsiy yordamchingizman.</div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const responseDiv = document.getElementById('response');
        const apiKeyInput = document.getElementById('apiKey');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (!SpeechRecognition) {
            statusDiv.innerText = "Xatolik: Brauzeringiz ovozli tanishni qo'llab-quvvatlamaydi.";
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ';

            startBtn.addEventListener('click', () => {
                if(!apiKeyInput.value.trim()){
                    alert("Iltimos, avval Mistral API kalitingizni kiriting!");
                    return;
                }
                try {
                    recognition.start();
                    statusDiv.innerText = "Tinglanmoqda... Gapiring!";
                } catch(e) {
                    console.log(e);
                }
            });

            // To'xtatish tugmasi
            stopBtn.addEventListener('click', () => {
                recognition.stop();
                window.speechSynthesis.cancel(); // Jarvis gapirayotgan bo'lsa darhol to'xtatadi
                statusDiv.innerText = "Jarvis to'xtatildi.";
                responseDiv.innerHTML = "<strong>Jarvis:</strong> Amaliyot bekor qilindi.";
            });

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                statusDiv.innerText = "Siz: " + transcript;
                responseDiv.innerHTML = "<strong>Jarvis:</strong> Ma'lumot qayta ishlanmoqda...";

                const aiAnswer = await askMistral(transcript, apiKeyInput.value.trim());
                responseDiv.innerHTML = "<strong>Jarvis:</strong> " + aiAnswer;
                speak(aiAnswer);
            };

            recognition.onerror = (event) => {
                statusDiv.innerText = "Xatolik yuz berdi: " + event.error;
            };
            
            recognition.onend = () => {
                if(statusDiv.innerText.includes("Tinglanmoqda")) {
                    statusDiv.innerText = "Tizim kutish rejimida.";
                }
            };
        }

        async function askMistral(prompt, apiKey) {
            try {
                const res = await fetch('https://api.netlify.app/.../v1/chat/completions' || 'https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-tiny',
                        messages: [{ role: 'user', content: prompt }]
                    })
                });
                const data = await res.json();
                return data.choices[0].message.content;
            } catch (err) {
                return "Tarmoq xatosi: API kalitni tekshiring yoki internetni yoqing.";
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Oldingi ovozni tozalash
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'uz-UZ';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
      </html>
