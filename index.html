<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice Assistant</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 { color: #58a6ff; font-size: 2rem; margin-bottom: 20px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 14px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:active { background-color: #2ea043; transform: scale(0.98); }
        #status { margin-top: 15px; font-size: 14px; color: #8b949e; }
        #response {
            margin-top: 20px;
            text-align: left;
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            min-height: 80px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>J.A.R.V.I.S</h1>
        <input type="password" id="apiKey" placeholder="Mistral API Kalitingizni kiriting">
        <button id="startBtn">🎤 Gapirish</button>
        <div id="status">Tugmani bosing va gapiring...</div>
        <div id="response"><strong>Jarvis:</strong> Sizni eshitmoqdaman...</div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const responseDiv = document.getElementById('response');
        const apiKeyInput = document.getElementById('apiKey');

        // Brauzer ovoz tanish funksiyasi
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusDiv.innerText = "Kechirasiz, brauzeringiz ovozli kirishni qo'llab-quvvatlamaydi.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'uz-UZ'; // O'zbek tili

            startBtn.addEventListener('click', () => {
                if(!apiKeyInput.value.trim()){
                    alert("Iltimos, avval Mistral API kalitingizni kiriting!");
                    return;
                }
                recognition.start();
                statusDiv.innerText = "Tinglanmoqda...";
            });

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                statusDiv.innerText = "Siz: " + transcript;
                responseDiv.innerHTML = "<strong>Jarvis:</strong> O'ylanmoqda...";

                // Mistral API ga so'rov yuborish
                const aiAnswer = await askMistral(transcript, apiKeyInput.value.trim());
                responseDiv.innerHTML = "<strong>Jarvis:</strong> " + aiAnswer;
                
                // Ovozda o'qish
                speak(aiAnswer);
            };

            recognition.onerror = (event) => {
                statusDiv.innerText = "Xatolik yuz berdi: " + event.error;
            };
        }

        async function askMistral(prompt, apiKey) {
            try {
                const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-tiny',
                        messages: [{ role: 'user', content: prompt }]
                    })
                });
                const data = await res.json();
                return data.choices[0].message.content;
            } catch (err) {
                return "Xatolik: API kalit xato yoki tarmoqda muammo bor.";
            }
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'uz-UZ';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
